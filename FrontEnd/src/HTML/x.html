<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .form-container {
            max-width: 500px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        .form-group button {
            padding: 10px 15px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .form-group button:hover {
            background-color: #0056b3;
        }

        .product-image {
            height: 100px;
            width: 100px;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h2>Add Product</h2>
        <form id="productForm">
            <div class="form-group">
                <label for="ProductID">Product ID</label>
                <input type="text" id="ProductID" name="ProductID" required>
            </div>
            <div class="form-group">
                <label for="Name">Product Name</label>
                <input type="text" id="Name" name="Name" required>
            </div>
            <div class="form-group">
                <label for="Description">Description</label>
                <textarea id="Description" name="Description" required></textarea>
            </div>
            <div class="form-group">
                <label for="Quantity">Quantity</label>
                <input type="number" id="Quantity" name="Quantity" required>
            </div>
            <div class="form-group">
                <label for="Price">Price</label>
                <input type="number" id="Price" name="Price" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="CategoryID">Category ID</label>
                <input type="text" id="CategoryID" name="CategoryID" required>
            </div>
            <div class="form-group">
                <label for="Show">Show Product</label>
                <input type="checkbox" id="Show" name="Show">
            </div>
            <div class="form-group">
                <label for="Photo">Photo</label>
                <input type="file" id="Photo" name="Photo">
            </div>
            <div class="form-group">
                <button type="submit">Add Product</button>
            </div>
        </form>


        <div id="productImage"></div>
    </div>

    <script>
        document.getElementById("productForm").addEventListener("submit", async function (event) {
            event.preventDefault();

            const formData = new FormData(this);

            try {
                const response = await fetch("http://localhost:3000/product/products", {
                    method: "POST",
                    body: formData,
                });

                if (response.ok) {
                    const result = await response.json();
                    alert("Product added successfully!");
                    console.log(result);
                } else {
                    alert("Failed to add product.");
                }
            } catch (error) {
                console.error("Error:", error);
            }
        });
        async function fetchProduct(ProductID) {
            try {
                const response = await fetch(`http://localhost:3000/product/products/${ProductID}`);
                if (response.ok) {
                    const result = await response.json();
                    const product = result.data;

                    // Create an image element
                    const img = document.createElement('img');
                    img.src = `data:image/jpeg;base64,${product.Photo}`;
                    img.alt = product.Name;
                    img.classList.add('product-image');
                    // Append the image to the DOM (for example, to a div with id 'productImage')
                    document.getElementById('productImage').appendChild(img);
                } else {
                    console.error("Failed to fetch product.");
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }

        // Call the function with the product ID
        fetchProduct(1);

    </script>
</body>
