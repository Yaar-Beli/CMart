<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Authentication Test</title>
</head>
<body>

    <h2>Login</h2>
    <form id="loginForm">
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>
        <label for="password" >Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>
        <button type="submit">Login</button>
    </form>

    <h2>Verify Token</h2>
    <button id="verifyTokenBtn">Verify Token</button>

    <h2>Response</h2>
    <pre id="response"></pre>

    <script>
        const apiUrl = "http://localhost:3000"; // Replace with your actual backend URL

        document.getElementById("loginForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            const Email = document.getElementById("email").value;
            const Password = document.getElementById("password").value;

            console.log("Email: " + Email )
            console.log("Password: " + Password)

            const response = await fetch(`${apiUrl}/auth/login`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ Email, Password })
            });

            const data = await response.json();
            if (response.ok) {
                // Store the JWT token in localStorage
                localStorage.setItem("authToken", data.token);
                document.getElementById("response").innerText = "Login successful! Token stored in localStorage.";
            } else {
                document.getElementById("response").innerText = `Login failed: ${data.message}`;
            }
        });

        document.getElementById("verifyTokenBtn").addEventListener("click", async function() {
            const token = localStorage.getItem("authToken");

            if (!token) {
                document.getElementById("response").innerText = "No token found. Please login first.";
                return;
            }

            const response = await fetch(`${apiUrl}/auth/verifyToken`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                }
            });

            const data = await response.json();
            if (response.ok && data.valid) {
                document.getElementById("response").innerText = `Token is valid! User: ${JSON.stringify(data.user)}`;
            } else {
                document.getElementById("response").innerText = `Token verification failed: ${data.message}`;
                localStorage.removeItem("authToken");
            }
        });
    </script>

</body>
</html>
